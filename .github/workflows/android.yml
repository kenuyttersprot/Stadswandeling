name: Android-app bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Versienummer in de app zetten
        run: sed -i "s/__APP_VERSION__/1.${{ github.run_number }}/" www/index.html

      - name: Web-app naar Android kopiëren
        run: npx cap sync android

      - name: APK bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK klaarzetten
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stadswandeling.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stadswandeling-apk
          path: Stadswandeling.apk

      - name: Release met APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stadswandeling (build ${{ github.run_number }})
          body: Download Stadswandeling.apk op je Android-gsm en installeer.
          files: Stadswandeling.apk
